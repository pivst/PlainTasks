name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -W error::SyntaxWarning -m compileall -q APlainTasksCommon.py PlainTasks.py PlainTasksDates.py PlainTasksToHTML.py tests tools
      - run: python -W error::DeprecationWarning tests/run.py
      - run: python -m pip install --no-compile --target .build-libs -r requirements.txt
      - run: python tools/build_release.py --libraries .build-libs
      - name: Check Windows PowerShell 5.1 installer entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bundle = Get-ChildItem dist -Filter 'PlainTasks-*-windows.zip' | Select-Object -First 1
          Expand-Archive -LiteralPath $bundle.FullName -DestinationPath .build-bundle
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\windows_delivery_selftest.ps1 -BundleRoot "$PWD\.build-bundle"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation checks failed' }
      - name: Upload distribution
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlainTasks-windows
          path: dist/*
          retention-days: 14
