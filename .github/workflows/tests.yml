name: Python 3.14 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -W error::SyntaxWarning -m compileall -q APlainTasksCommon.py PlainTasks.py PlainTasksDates.py PlainTasksToHTML.py plist_parser.py tests
      - run: python -W error::DeprecationWarning tests/run.py
